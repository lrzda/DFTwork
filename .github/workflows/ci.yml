name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: project/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tracked parity golden
        shell: bash
        run: |
          node scripts/gen-golden.mjs
          git diff --exit-code -- tests/golden/reference
          test -z "$(git status --porcelain -- tests/golden/reference)"
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Check Rust workspace
        run: cargo check --workspace --locked
      - name: Typecheck TypeScript workspaces
        run: pnpm typecheck
      - name: Build debug core for desktop tests
        run: cargo build -p vasp-cli --locked
      - name: Build and test Electron
        run: pnpm test:desktop
